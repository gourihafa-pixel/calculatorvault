name: Build Signed AAB for Google Play

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          sudo mv gradle-8.2 /opt/gradle
          sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Decode keystore from secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "storeFile=keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build signed AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Verify AAB exists
        run: |
          ls -lh app/build/outputs/bundle/release/app-release.aab
          unzip -l app/build/outputs/bundle/release/app-release.aab | head -20

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-signed-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
