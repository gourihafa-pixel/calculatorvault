name: Build Signed AAB for Google Play

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -d /opt gradle-8.2-bin.zip
          sudo ln -sf /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          printf "storeFile=$(pwd)/keystore.jks\nstorePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\n" > keystore.properties

      - name: Build signed AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Verify AAB exists
        run: |
          ls -lh app/build/outputs/bundle/release/
          unzip -l app/build/outputs/bundle/release/app-release.aab | head -20

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
