plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read signing config from keystore.properties if it exists.
// This file is injected by the GitHub Actions workflow from secrets.
// NEVER commit keystore.properties or *.jks to the repository.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeystore = (
        keystoreProperties.containsKey('storeFile') &&
        keystoreProperties.containsKey('storePassword') &&
        keystoreProperties.containsKey('keyAlias') &&
        keystoreProperties.containsKey('keyPassword')
    )
}

android {
    namespace 'com.calcvault.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.calcvault.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystypeCheck(keystoreProperties['keyPassword'])
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.named('release').get()
            } else {
                // No keystore available yet — produced APK/AAB will be unsigned.
                signingConfig signingConfigs.named('debug')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

// Helper to keep keyPassword typed as String (avoid any IDE warning).
String keystypeCheck(def v) { v == null ? '' : v.toString() }

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'net.objecthunter:exp4j:0.4.8'
}
